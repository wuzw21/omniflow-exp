<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Timing illustration for an AndroidWorld cache-hit replay task</title>
  <desc id="desc">A 0 to 30 second timeline comparing a reactive VLM baseline that continues beyond the visible axis with OmniFlow cache-first replay ending at 11.745 seconds on average. Internal blocks are schematic; total markers use frozen evaluation-matrix values.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f6f7fb"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 26px Georgia, "Times New Roman", serif; fill: #f7f7fb; paint-order: stroke; stroke: #000; stroke-width: 3px; }
      .subtitle { font: 600 17px Arial, sans-serif; fill: #f1f5f9; }
      .axis { stroke: #f6f7fb; stroke-width: 2; marker-end: url(#arrow); }
      .grid { stroke: #ffffff; stroke-opacity: 0.18; stroke-width: 1; }
      .tick { font: 16px Arial, sans-serif; fill: #f6f7fb; paint-order: stroke; stroke: #000; stroke-width: 3px; }
      .axisLabel { font: 19px Georgia, "Times New Roman", serif; fill: #f6f7fb; paint-order: stroke; stroke: #000; stroke-width: 3px; }
      .small { font: 14px Arial, sans-serif; fill: #cbd5e1; }
      .note { font: 13px Arial, sans-serif; fill: #d7dee9; }
      .vlmText { font: 700 22px Arial, sans-serif; fill: #d63333; }
      .actText { font: 700 15px Arial, sans-serif; fill: #203bd8; }
      .omniText { font: 700 18px Arial, sans-serif; fill: #24763a; }
      .controlText { font: 700 15px Arial, sans-serif; fill: #a45b00; }
      .verifyText { font: 700 15px Arial, sans-serif; fill: #5b35b6; }
      .callout { font: 700 15px Arial, sans-serif; fill: #ffd1d1; }
      .metric { font: 700 17px Arial, sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#07080b"/>

  <text x="600" y="34" text-anchor="middle" class="title">AndroidWorld Open-App Task Timeline</text>
  <text x="600" y="60" text-anchor="middle" class="small">Reactive VLM reasoning vs. OmniFlow cache-first replay; 0-30s zoom view</text>

  <!-- Coordinate system: x=110 is 0s, x=950 is 30s, scale=28 px/sec. -->
  <g id="grid">
    <line x1="110" y1="86" x2="110" y2="410" class="grid"/>
    <line x1="250" y1="86" x2="250" y2="410" class="grid"/>
    <line x1="390" y1="86" x2="390" y2="410" class="grid"/>
    <line x1="530" y1="86" x2="530" y2="410" class="grid"/>
    <line x1="670" y1="86" x2="670" y2="410" class="grid"/>
    <line x1="810" y1="86" x2="810" y2="410" class="grid"/>
    <line x1="950" y1="86" x2="950" y2="410" class="grid"/>
  </g>

  <text x="540" y="96" text-anchor="middle" class="subtitle">Common Approach: Reactive VLM Loop</text>
  <text x="540" y="258" text-anchor="middle" class="subtitle">Ours: OmniFlow Cache-First Replay</text>

  <!-- Top row: six schematic 5s VLM/action cycles over the visible 30s window. -->
  <g id="reactive-row" filter="url(#softShadow)">
    <rect x="110" y="110" width="119" height="82" fill="#ffd2d2" stroke="#ff4d4f" stroke-width="3"/>
    <text x="169.5" y="159" text-anchor="middle" class="vlmText">VLM</text>
    <rect x="229" y="110" width="21" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(243,174) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="250" y="110" width="119" height="82" fill="#ffd2d2" stroke="#ff4d4f" stroke-width="3"/>
    <text x="309.5" y="159" text-anchor="middle" class="vlmText">VLM</text>
    <rect x="369" y="110" width="21" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(383,174) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="390" y="110" width="119" height="82" fill="#ffd2d2" stroke="#ff4d4f" stroke-width="3"/>
    <text x="449.5" y="159" text-anchor="middle" class="vlmText">VLM</text>
    <rect x="509" y="110" width="21" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(523,174) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="530" y="110" width="119" height="82" fill="#ffd2d2" stroke="#ff4d4f" stroke-width="3"/>
    <text x="589.5" y="159" text-anchor="middle" class="vlmText">VLM</text>
    <rect x="649" y="110" width="21" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(663,174) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="670" y="110" width="119" height="82" fill="#ffd2d2" stroke="#ff4d4f" stroke-width="3"/>
    <text x="729.5" y="159" text-anchor="middle" class="vlmText">VLM</text>
    <rect x="789" y="110" width="21" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(803,174) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="810" y="110" width="119" height="82" fill="#ffd2d2" stroke="#ff4d4f" stroke-width="3"/>
    <text x="869.5" y="159" text-anchor="middle" class="vlmText">VLM</text>
    <rect x="929" y="110" width="21" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(943,174) rotate(-90)" text-anchor="middle" class="actText">Action</text>
  </g>

  <line x1="960" y1="151" x2="1120" y2="151" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#redArrow)"/>
  <text x="1040" y="123" text-anchor="middle" class="callout">continues</text>
  <text x="1040" y="176" text-anchor="middle" class="callout">292.7s avg</text>
  <text x="1040" y="196" text-anchor="middle" class="small">146.359 min / 30</text>

  <line x1="80" y1="225" x2="1135" y2="225" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Bottom row: total width is 11.745s * 28px = 328.86px. Internal blocks are schematic. -->
  <g id="omniflow-row" filter="url(#softShadow)">
    <rect x="110" y="286" width="329" height="82" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
    <text x="193" y="326" text-anchor="middle" class="omniText">Function</text>
    <text x="193" y="348" text-anchor="middle" class="omniText">lookup</text>

    <rect x="244" y="286" width="26" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(262,352) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="270" y="286" width="68" height="82" fill="#ffedc7" stroke="#f59e0b" stroke-width="3"/>
    <text x="304" y="318" text-anchor="middle" class="controlText">Control</text>
    <text x="304" y="337" text-anchor="middle" class="controlText">logic</text>

    <rect x="338" y="286" width="25" height="82" fill="#dfe4ff" stroke="#3451ff" stroke-width="3"/>
    <text transform="translate(356,352) rotate(-90)" text-anchor="middle" class="actText">Action</text>

    <rect x="363" y="286" width="51" height="82" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
    <text x="388.5" y="321" text-anchor="middle" class="omniText">Replay</text>
    <text x="388.5" y="343" text-anchor="middle" class="omniText">steps</text>

    <rect x="414" y="286" width="25" height="82" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text transform="translate(432,352) rotate(-90)" text-anchor="middle" class="verifyText">Verify</text>
  </g>

  <line x1="439" y1="276" x2="439" y2="385" stroke="#f8fafc" stroke-width="2"/>
  <text x="456" y="296" class="metric">11.745s avg replay</text>
  <text x="456" y="318" class="small">0 online tokens / model calls</text>

  <!-- Axis -->
  <line x1="110" y1="425" x2="985" y2="425" class="axis"/>
  <g id="ticks">
    <line x1="110" y1="419" x2="110" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="110" y="458" text-anchor="middle" class="tick">0</text>
    <line x1="250" y1="419" x2="250" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="250" y="458" text-anchor="middle" class="tick">5</text>
    <line x1="390" y1="419" x2="390" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="390" y="458" text-anchor="middle" class="tick">10</text>
    <line x1="530" y1="419" x2="530" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="530" y="458" text-anchor="middle" class="tick">15</text>
    <line x1="670" y1="419" x2="670" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="670" y="458" text-anchor="middle" class="tick">20</text>
    <line x1="810" y1="419" x2="810" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="810" y="458" text-anchor="middle" class="tick">25</text>
    <line x1="950" y1="419" x2="950" y2="433" stroke="#f6f7fb" stroke-width="2"/>
    <text x="950" y="458" text-anchor="middle" class="tick">30</text>
  </g>
  <text x="548" y="486" text-anchor="middle" class="axisLabel">Time (seconds)</text>

  <text x="110" y="511" class="note">Source: eval matrix registered AndroidWorld first-30 aggregates. Internal stage widths are schematic; total markers are quantitative.</text>
</svg>

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniflow-exp"
version = "0.1.0"
description = "Paper-only AndroidWorld evaluation for OmniFlow"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "absl-py==2.1.0",
    "android-env==1.2.3",
    "dm-env==1.6",
    "dashscope>=1.24",
    "fuzzywuzzy==0.18.0",
    "grpcio-tools==1.71.0",
    "google-generativeai>=0.8",
    "google-search-results==2.4.2",
    "immutabledict==2.0.0",
    "ipython>=8",
    "json-repair==0.61.7",
    "jsonschema>=4.23",
    "lxml>=5",
    "matplotlib>=3.6",
    "numpy==1.26.4",
    "openai>=1.99.9",
    "opencv-python>=4.11",
    "pandas>=2.1",
    "pillow>=10",
    "pydub>=0.25",
    "pyshine>=0.0.9",
    "python-Levenshtein>=0.27",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tenacity>=8",
    "termcolor>=2.3",
    "torch>=2.2",
    "uiautomator2>=3.7",
]

[project.optional-dependencies]
bmoca = ["droidrun==0.5.6"]
llm = []

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.b64"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.data-files]
"schemas/oob" = [
    "schemas/oob/README.md",
    "schemas/oob/oob_canonical_actions.v1.json",
    "schemas/oob/omniflow_run_log.v1.json",
    "schemas/oob/omniflow_checker_rule.v1.json",
    "schemas/oob/omniflow_checker_store.v1.json",
    "schemas/oob/omniflow_function.v2.json",
    "schemas/oob/omniflow_android_bridge.v2.json",
]

[tool.setuptools.packages.find]
include = [
    "omniflow",
    "omniflow.*",
    "src",
    "src.*",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
